<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090d"><title>SMART 1.1</title>
<link rel="preconnect" href="https://generativelanguage.googleapis.com">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body>
<aside id="side"><div class="brand"><i></i>SMART <span class="ver">1.1</span></div><button id="new">+ Nouvelle conversation</button><ul id="list"></ul>
<div class="foot"><button id="memBtn">Mémoire</button><button id="setBtn">Réglages</button><button id="exp">Exporter</button><label class="btn">Importer<input id="imp" type="file" accept=".json" hidden></label></div></aside>
<main><header><button id="menu" aria-label="Menu">☰</button><span id="title"></span><select id="speed" title="Vitesse de réflexion"><option value="fast">⚡ Rapide</option><option value="balanced">Équilibré</option><option value="deep">Approfondi</option></select><span id="badge"></span></header>
<div id="msgs"></div>
<form id="form"><textarea id="inp" rows="1" placeholder="Écrivez votre message…" aria-label="Message"></textarea>
<button id="send" aria-label="Envoyer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
<button id="stop" type="button" aria-label="Interrompre" hidden><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="3"/></svg></button></form>
<p class="hint">SMART 1.1 peut se tromper : vérifiez les informations importantes.</p></main>
<dialog id="dlg"></dialog><script type="module" src="app.js"></script></body></html>
